name: Piyasa verisi

# Yalnızca zamanlanmış ve elle tetikleme. pull_request TETİKLEYİCİSİ BİLİNÇLİ OLARAK YOK:
# depo public olduğu için fork'tan gelen bir PR iş akışını çalıştırıp secret'lara
# uzanamamalı.
on:
  schedule:
    - cron: "20 4 * * *"   # her gün 04:20 UTC (07:20 TR)
  workflow_dispatch:
    inputs:
      kip:
        description: "Ne yapsın?"
        type: choice
        default: guncelle
        options: [guncelle, probe, dry-run]

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Secret yoksa her gün anlamsız bir yığın hata üretmesin; ne yapılacağını söylesin.
      - name: Kimlik var mı?
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
        run: |
          if [ -z "$EPIAS_USERNAME" ]; then
            echo "::error title=EPİAŞ kimliği eksik::Settings → Secrets and variables → Actions altına EPIAS_USERNAME ve EPIAS_PASSWORD ekleyin. Bu iş, o iki secret girilene kadar çalışamaz."
            exit 1
          fi

      # Teşhis kipleri hiçbir dosya yazmaz; yalnızca EPİAŞ'ın ne döndürdüğünü rapor eder.
      # Böylece uç adı araştırması için parolanın makineye inmesi gerekmiyor.
      - name: EPİAŞ'tan çek
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          case "${{ inputs.kip || 'guncelle' }}" in
            probe)    python tools/epias_mirror.py --days 45 --probe ;;
            dry-run)  python tools/epias_mirror.py --days 95 --dry-run ;;
            *)        python tools/epias_mirror.py --days 90 --out data/piyasa/ptf-yekdem.json ;;
          esac

      - name: Değiştiyse yaz
        if: ${{ (inputs.kip || 'guncelle') == 'guncelle' }}
        run: |
          if [ -n "$(git status --porcelain data/piyasa)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/piyasa
            git commit -m "Piyasa verisi güncellendi ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Değişiklik yok."
          fi
